[project]
name = "policy-classifier-small"
version = "0.1.0"
description = "A small policy alignment classifier for AI agent trace events, with an eval and a React page."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
